# The core stack from docker-compose.yml, plus Listmonk for outgoing email.
#   docker compose -f docker-compose.full.yml up -d
# Platforms that can't read `include` (such as Coolify) use docker-compose.coolify.yml,
# generated from these two files by scripts/generate-coolify-compose.mjs.
include:
  - docker-compose.yml

services:
  listmonk-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MEOWBERT_LISTMONK_POSTGRES_DB:-listmonk}
      POSTGRES_USER: ${MEOWBERT_LISTMONK_POSTGRES_USER:-listmonk}
      POSTGRES_PASSWORD: ${MEOWBERT_LISTMONK_POSTGRES_PASSWORD:-listmonk}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEOWBERT_LISTMONK_POSTGRES_USER:-listmonk} -d ${MEOWBERT_LISTMONK_POSTGRES_DB:-listmonk}"]
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 2s
      interval: 8760h
    volumes:
      - type: bind
        source: ${MEOWBERT_LISTMONK_POSTGRES_DATA_PATH:-/data/meowbert/listmonk-postgres-data}
        target: /var/lib/postgresql/data
  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"
      ]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__user: ${MEOWBERT_LISTMONK_POSTGRES_USER:-listmonk}
      LISTMONK_db__password: ${MEOWBERT_LISTMONK_POSTGRES_PASSWORD:-listmonk}
      LISTMONK_db__database: ${MEOWBERT_LISTMONK_POSTGRES_DB:-listmonk}
      LISTMONK_db__host: listmonk-postgres
      LISTMONK_db__port: "5432"
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: "25"
      LISTMONK_db__max_idle: "25"
      LISTMONK_db__max_lifetime: 300s
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-listmonk}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-listmonk}
      TZ: UTC
    ports:
      - "${MEOWBERT_LISTMONK_BIND_ADDRESS:-127.0.0.1}:${MEOWBERT_LISTMONK_HOST_PORT:-9000}:9000"
    depends_on:
      listmonk-postgres:
        condition: service_healthy
