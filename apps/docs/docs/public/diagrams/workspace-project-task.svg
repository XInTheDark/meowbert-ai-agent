<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
  <title id="title">Workspaces contain Projects and tasks</title>
  <desc id="desc">One workspace can contain several Projects. Each Project has its own files, context and task conversations.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b}.box{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}.title{font-size:21px;font-weight:650}.copy{font-size:18px}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="560" height="320" rx="12" fill="#fff"/>
  <rect class="box" x="16" y="16" width="528" height="288" rx="12"/>
  <text class="title" x="32" y="49">Workspace: Personal</text>
  <rect x="32" y="76" width="240" height="210" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text class="title" x="48" y="109">Project: Reports</text>
  <text class="copy" x="48" y="137">Shared files and context</text>
  <rect class="box" x="48" y="155" width="208" height="48" rx="8"/>
  <text class="copy" x="64" y="185">Task: Analyze sales</text>
  <rect class="box" x="48" y="217" width="208" height="48" rx="8"/>
  <text class="copy" x="64" y="247">Task: Write summary</text>
  <rect x="288" y="76" width="240" height="210" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text class="title" x="304" y="109">Project: Website</text>
  <text class="copy" x="304" y="137">Its own files and context</text>
  <rect class="box" x="304" y="155" width="208" height="48" rx="8"/>
  <text class="copy" x="320" y="185">Task: Fix navigation</text>
  <rect class="box" x="304" y="217" width="208" height="48" rx="8"/>
  <text class="copy" x="320" y="247">Task: Update docs</text>
</svg>
