<svg xmlns="http://www.w3.org/2000/svg" width="560" height="384" viewBox="0 0 560 384" role="img" aria-labelledby="title desc">
  <title id="title">How Meowbert runs a task</title>
  <desc id="desc">You describe a task in the app. The server keeps its conversation, asks a model for actions, and executes those actions on the server or an enabled local computer.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b}.box{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}.title{font-size:21px;font-weight:650}.copy{font-size:18px}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="560" height="384" rx="12" fill="#fff"/>
  <rect class="box" x="16" y="16" width="528" height="72" rx="10"/>
  <text class="title" x="280" y="46" text-anchor="middle">You describe a task</text>
  <text class="copy" x="280" y="72" text-anchor="middle">Web app, desktop app or a connected messaging tool</text>
  <path class="arrow" d="M 280 92 V 125"/>
  <rect class="box" x="16" y="132" width="528" height="80" rx="10"/>
  <text class="title" x="280" y="164" text-anchor="middle">Meowbert server</text>
  <text class="copy" x="280" y="192" text-anchor="middle">Keeps the conversation and coordinates the work</text>
  <path class="arrow" marker-start="url(#arrow)" d="M 139 218 V 268"/>
  <path class="arrow" marker-start="url(#arrow)" d="M 422 218 V 268"/>
  <rect class="box" x="16" y="275" width="246" height="88" rx="10"/>
  <text class="title" x="32" y="309">Task execution</text>
  <text class="copy" x="32" y="340">Server or your computer</text>
  <rect class="box" x="300" y="275" width="244" height="88" rx="10"/>
  <text class="title" x="316" y="309">Your model provider</text>
  <text class="copy" x="316" y="340">Chooses the next actions</text>
</svg>
