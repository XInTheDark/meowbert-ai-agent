<svg xmlns="http://www.w3.org/2000/svg" width="560" height="346" viewBox="0 0 560 346" role="img" aria-labelledby="title desc">
  <title id="title">Local execution with server-hosted files</title>
  <desc id="desc">The server and desktop both read and write the same storage backend. The desktop executes commands; the server manages task state.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b}.box{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}.title{font-size:21px;font-weight:650}.copy{font-size:18px}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="560" height="346" rx="12" fill="#fff"/>
  <rect class="box" x="16" y="20" width="246" height="112" rx="10"/>
  <text class="title" x="32" y="55">Server</text>
  <text class="copy" x="32" y="86">Conversation + task state</text>
  <text class="copy" x="32" y="111">Model connection</text>
  <rect class="box" x="300" y="20" width="244" height="112" rx="10"/>
  <text class="title" x="316" y="55">Your computer</text>
  <text class="copy" x="316" y="86">Runs task commands</text>
  <text class="copy" x="316" y="111">Uses a local mount</text>
  <path class="arrow" marker-start="url(#arrow)" d="M 139 137 V 233"/>
  <path class="arrow" marker-start="url(#arrow)" d="M 422 137 V 233"/>
  <rect x="58" y="169" width="162" height="28" fill="#fff"/>
  <text class="copy" x="139" y="189" text-anchor="middle">read and write</text>
  <rect x="341" y="169" width="162" height="28" fill="#fff"/>
  <text class="copy" x="422" y="189" text-anchor="middle">read and write</text>
  <rect class="box" x="16" y="240" width="528" height="86" rx="10"/>
  <text class="title" x="280" y="275" text-anchor="middle">The same workspace storage</text>
  <text class="copy" x="280" y="304" text-anchor="middle">One backend, accessible from both computers</text>
</svg>
