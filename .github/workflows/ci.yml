name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the example config
        run: cp config/global.example.json config/global.json

      - name: Check the generated Coolify compose file
        run: |
          node scripts/generate-coolify-compose.mjs --check
          diff <(docker compose -f docker-compose.full.yml config) <(docker compose -f docker-compose.coolify.yml config)

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
