name: Publish Sandbox Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/publish-sandbox-runtime.yml"
      - "apps/sandbox-runtime/**"
      - "apps/worker/scripts/resolve-browser-use-build.mjs"
      - "apps/worker/scripts/resolve-office-build.mjs"
      - "config/global.docker.json"
      - "config/global.example.json"
      - "config/global.json"
      - "package-lock.json"
      - "package.json"
      - "skills/**"
      - "packages/shared/src/path-containment.mjs"

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/sandbox-runtime" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=sha,prefix=sha-

      - name: Build and push sandbox runtime image
        uses: docker/build-push-action@v6
        env:
            DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/sandbox-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Sandbox runtime image published"
            echo
            echo "Image: \`$IMAGE_NAME\`"
            echo
            echo "Tags:"
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && echo "- \`$tag\`"
            done <<< "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
