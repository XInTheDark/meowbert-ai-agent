name: Dependabot auto-merge

# Merges grouped Dependabot patch/minor PRs once CI has passed. Major bumps and
# ungrouped PRs are left for manual review. This runs from the default branch and
# never checks out or executes the PR's code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      contains(github.event.workflow_run.head_branch, 'minor-and-patch')
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is attached to this run."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --squash
