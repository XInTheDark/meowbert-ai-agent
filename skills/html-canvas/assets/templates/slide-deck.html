<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{TITLE}}</title>
    <script src="./meowbert-deck.js"></script>
    <style>
      :root {
        --paper: #f7f6f2;
        --ink: #1b1c1e;
        --muted: #5d6066;
        --accent: oklch(0.55 0.13 250);
        --margin: 120px;
      }

      body {
        margin: 0;
        font-family: "Liberation Sans", "Noto Sans", sans-serif;
        color: var(--ink);
        text-wrap: pretty;
      }

      a { color: var(--accent); }
      a:hover { color: var(--ink); }

      .slide {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 32px;
        padding: var(--margin);
        background: var(--paper);
      }

      h1, h2, p { margin: 0; }
      h1 { font-size: 112px; line-height: 1; letter-spacing: -0.02em; }
      h2 { font-size: 72px; line-height: 1.05; }
      p { max-width: 28ch; font-size: 40px; line-height: 1.35; color: var(--muted); }
    </style>
  </head>
  <body>
    <!-- One <section data-meowbert-page> per slide. Each is 1920x1080; the deck scales it on screen. -->
    <meowbert-deck width="1920" height="1080">
      <section class="slide" data-meowbert-page data-label="Title" data-notes="">
        <h1>{{TITLE}}</h1>
        <p>{{SUBTITLE}}</p>
      </section>

      <section class="slide" data-meowbert-page data-label="Section" data-notes="">
        <h2>Section heading</h2>
      </section>
    </meowbert-deck>
  </body>
</html>
